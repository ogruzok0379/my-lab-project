name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List files
        run: ls -la

      - name: Check README exists
        run: test -f README.md && echo "README.md found"

      - name: Debug - show test-secret.txt
        run: cat test-secret.txt || echo "test-secret.txt NOT FOUND"

      - name: TruffleHog Secret Scan (filesystem)
        run: |
          echo ".git/" > .trufflehogignore
          docker run --rm -v "$PWD:/p" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /p \
            --results=verified,unknown,unverified \
            --exclude-paths=.trufflehogignore \
            --fail || exit 1
