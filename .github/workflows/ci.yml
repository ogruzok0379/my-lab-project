name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Check README exists
        run: test -f README.txt && echo "README.txt found"

      - name: Check no real secrets (placeholder for TruffleHog later)
        run: echo "CI passed"
